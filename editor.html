<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黃線停車 校正工具</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #d9dde5;
    --accent: #1565c0; --high: #2e7d32; --low: #ef6c00; --manual: #1565c0; --excluded: #757575; --need: #c62828;
    --sel: #fff3c4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --panel: #1b212b; --text: #e6e9ef; --muted: #9aa4b5; --line: #2e3745;
      --accent: #64a8ff; --high: #66bb6a; --low: #ffa040; --manual: #64a8ff; --excluded: #9e9e9e; --need: #ef6f6f;
      --sel: #3a3420;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.5 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: var(--text); background: var(--bg);
         display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  #progress { color: var(--muted); flex: 1; min-width: 260px; }
  #progress b { color: var(--text); }
  button, select, input[type=search], textarea { font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--need); }
  #banner { display: none; padding: 6px 12px; background: var(--sel); border-bottom: 1px solid var(--line); }
  #banner.show { display: block; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 400px 1fr; }
  aside { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
  #filters { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); }
  #filters input { flex: 1; min-width: 0; }
  #list { flex: 1 1 40%; min-height: 120px; overflow: auto; margin: 0; padding: 0; list-style: none; }
  #list li { padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid;
             grid-template-columns: 1fr auto; gap: 0 8px; }
  #list li:hover { background: var(--bg); }
  #list li.sel { background: var(--sel); }
  #list .t { font-weight: 600; }
  #list .s { color: var(--muted); font-size: 12px; grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .st { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 12px; text-align: right; }
  .badge { display: inline-block; padding: 0 6px; border-radius: 10px; font-size: 12px; border: 1px solid currentColor; }
  .c-high { color: var(--high); } .c-low { color: var(--low); } .c-needs_manual { color: var(--need); }
  .c-manual, .st-confirmed, .st-redrawn { color: var(--manual); } .st-excluded { color: var(--excluded); }
  #detail { flex: 1 1 60%; min-height: 0; overflow: auto; padding: 10px 12px; border-top: 2px solid var(--line); }
  #detail h2 { font-size: 15px; margin: 0 0 6px; }
  #detail dl { display: grid; grid-template-columns: 4.5em 1fr; gap: 2px 8px; margin: 6px 0; }
  #detail dt { color: var(--muted); } #detail dd { margin: 0; }
  #detail ul { margin: 0; padding-left: 1.2em; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  textarea { width: 100%; min-height: 54px; resize: vertical; }
  .hint { color: var(--muted); font-size: 12px; }
  #mapwrap { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }
  #drawbar { display: none; position: absolute; z-index: 1000; top: 10px; left: 50%; transform: translateX(-50%);
             background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
             box-shadow: 0 2px 8px rgba(0,0,0,.25); gap: 8px; align-items: center; flex-wrap: wrap; max-width: 95%; }
  #drawbar.show { display: flex; }
  #legend { position: absolute; z-index: 1000; left: 10px; bottom: 22px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  #legend i { display: inline-block; width: 18px; height: 0; border-top: 4px solid; vertical-align: middle; margin-right: 4px; }
  #toast { position: fixed; z-index: 3000; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222; color: #fff;
           padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%; }
  #toast.show { opacity: .95; }
  .endpoint { width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid #1d2330; color: #1d2330;
              font-size: 12px; font-weight: 700; text-align: center; line-height: 16px; }
  .leaflet-container.drawing { cursor: crosshair; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; } }
</style>
</head>
<body>
<header>
  <h1>黃線停車 校正工具</h1>
  <div id="progress">載入中…</div>
  <button id="btn-export" class="primary" title="下載 overrides.json，覆蓋 data/manual/overrides.json 後執行 python etl/merge.py">匯出 overrides.json</button>
  <button id="btn-import">匯入</button>
  <button id="btn-reset" title="捨棄本機暫存，改用 repo 內的 overrides.json">重設</button>
  <input id="file" type="file" accept=".json,application/json" hidden>
</header>
<div id="banner"></div>
<main>
  <aside>
    <div id="filters">
      <select id="filter" aria-label="篩選">
        <option value="todo">待處理</option>
        <option value="all">全部</option>
        <option value="low">低信心</option>
        <option value="needs_manual">需人工</option>
        <option value="high">高信心（抽查）</option>
        <option value="handled">已處理</option>
      </select>
      <input id="query" type="search" placeholder="搜尋路名、編號、行政區">
    </div>
    <ul id="list"></ul>
    <section id="detail"><p class="hint">從清單或地圖選一個路段。</p></section>
  </aside>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="drawbar">
      <b>描線</b>
      <label><input type="radio" name="mode" value="route" checked> 沿路連線</label>
      <label><input type="radio" name="mode" value="free"> 自由描線</label>
      <button id="d-undo">復原一點</button>
      <button id="d-clear">清除</button>
      <button id="d-done" class="primary">完成</button>
      <button id="d-cancel">取消</button>
      <span id="d-info" class="hint"></span>
    </div>
    <div id="legend">
      <div><i style="border-color:var(--high)"></i>高信心（自動）</div>
      <div><i style="border-color:var(--low)"></i>低信心</div>
      <div><i style="border-color:var(--manual)"></i>已人工確認／重畫</div>
      <div><i style="border-color:var(--excluded);border-top-style:dashed"></i>已排除</div>
      <div><i style="border-color:#8a94a6;border-top-width:2px"></i>OSM 路網輔助</div>
    </div>
  </div>
</main>
<div id="toast" role="status"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="src/editor/main.js"></script>
</body>
</html>
