<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%85%BF%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>台北市假日黃線停車地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --text: #1b2230; --muted: #566174; --line: #d8dde6;
    --ok: #2e7d32; --ok-bg: #e6f4e7; --no: #c62828; --no-bg: #fbe9e9; --accent: #1565c0; --warn-bg: #fff4d6; --warn: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151c; --panel: #1a202a; --text: #e7eaf0; --muted: #9aa5b8; --line: #2d3644;
      --ok: #6fcf74; --ok-bg: #16301a; --no: #ff8a80; --no-bg: #3a1c1c; --accent: #7bb4ff; --warn-bg: #3a3017; --warn: #f1c46b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.55 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: var(--text); background: var(--bg);
         display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 12px; }
  header h1 { margin: 0 0 4px; font-size: 18px; }
  #disclaimer { margin: 0; padding: 6px 10px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 14px; font-weight: 600; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #mapwrap { position: relative; height: 42vh; min-height: 260px; flex: none; order: -1; }   /* 手機：地圖在上、清單在下 */
  #map { position: absolute; inset: 0; }
  #legend { position: absolute; z-index: 1000; left: 8px; bottom: 22px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 8px; padding: 4px 8px; font-size: 12px; }
  #legend i { display: inline-block; width: 18px; height: 0; border-top: 4px solid; vertical-align: middle; margin-right: 4px; }
  #panel { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px 28px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  #dayinfo { font-weight: 600; }
  #simbanner { display: none; margin-top: 6px; padding: 4px 8px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); }
  #simbanner.show { display: block; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  button, select, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.active { outline: 3px solid var(--accent); }
  button:disabled { opacity: .5; }
  #notice { display: none; margin: 8px 0 0; padding: 6px 10px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); }
  #notice.show { display: block; }
  #posinfo { color: var(--muted); font-size: 13px; margin-top: 6px; }
  details summary { cursor: pointer; font-weight: 600; }
  #sim { margin-top: 8px; }
  .empty { color: var(--muted); }
  ul.rows { list-style: none; margin: 0; padding: 0; }
  ul.rows > li { background: var(--panel); border: 1px solid var(--line); border-left-width: 6px; border-radius: 10px;
                 padding: 8px 12px; margin-bottom: 8px; cursor: pointer; }
  ul.rows > li.ok { border-left-color: var(--ok); }
  ul.rows > li.no { border-left-color: var(--no); }
  ul.rows > li.sel { box-shadow: 0 0 0 2px var(--accent); }
  .row-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .row-t { font-weight: 700; }
  .dist { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .chip { display: inline-block; padding: 1px 10px; border-radius: 12px; font-weight: 700; font-size: 14px; }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.no { background: var(--no-bg); color: var(--no); }
  .meta { color: var(--muted); font-size: 13px; }
  #error { display: none; }
  #error.show { display: block; }
  footer { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .leaflet-container.picking { cursor: crosshair; }
  @media (min-width: 900px) {
    main { flex-direction: row; }
    #panel { order: 1; flex: 0 0 440px; border-right: 1px solid var(--line); }
    #mapwrap { order: 2; flex: 1; height: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>台北市假日黃線停車地圖</h1>
  <p id="disclaimer" role="note">載入中…</p>
</header>
<main>
  <section id="panel" aria-label="查詢結果">
    <div id="error" class="card">
      <p id="error-text"></p>
      <button id="retry" class="primary">重試</button>
    </div>
    <div class="card">
      <div id="dayinfo"></div>
      <div id="simbanner">目前顯示的是「查詢其他時間」的結果，不是現在。</div>
      <div class="controls">
        <button id="btn-locate" class="primary">定位我的位置</button>
        <button id="btn-pick">在地圖上指定位置</button>
        <label>範圍
          <select id="radius">
            <option value="300">300 公尺</option>
            <option value="500" selected>500 公尺</option>
            <option value="1000">1 公里</option>
          </select>
        </label>
      </div>
      <p id="notice" role="alert"></p>
      <div id="posinfo"></div>
      <details id="sim">
        <summary>查詢其他時間</summary>
        <div class="controls">
          <input id="sim-input" type="datetime-local" aria-label="查詢時間（台北時間）">
          <button id="sim-now">回到現在</button>
        </div>
        <p class="meta">以台北時間計算，用來查「假日幾點可以停」。</p>
      </details>
    </div>
    <h2 id="list-title" style="font-size:16px;margin:12px 0 8px"></h2>
    <ul id="rows" class="rows"></ul>
    <p id="empty" class="empty"></p>
    <details id="unconfirmed" class="card" hidden>
      <summary id="unconfirmed-title"></summary>
      <p class="meta">這些路段的位置尚未確認，不會顯示在地圖上，也不會被判斷為可停；請依現場標誌為準。</p>
      <ul id="unconfirmed-list" style="padding-left:1.2em;margin:6px 0 0"></ul>
    </details>
    <footer>
      <div id="coverage"></div>
      <div>地圖資料 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者</div>
    </footer>
  </section>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="legend">
      <div><i style="border-color:#2e7d32"></i>現在可停</div>
      <div><i style="border-color:#c62828;border-top-style:dashed"></i>現在不可停</div>
    </div>
  </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
